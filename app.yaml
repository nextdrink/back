env: standard
runtime: nodejs18
service: nextdrink-back
vpc_access_connector:
  name: projects/nextdrink-dev/locations/europe-west3/connectors/nextdrink-serverless

handlers:
  - url: /.*
    secure: always
    script: auto

entrypoint: "cross-env NODE_ENV=production node dist/main.js"

env_variables:
  NODE_ENV: "production"
  PORT: 8080
  POSTGRES_HOST: $DBHOST
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "next-drink"
  POSTGRES_PASSWORD: $DBPASS
  POSTGRES_PORT: "5432"
  PRIVATE_KEY: $PRIVATE_KEY
  MAILGUN_API_KEY: $MAILGUN_API_KEY
  MAILGUN_API_DOMAIN: $MAILGUN_API_DOMAIN
  FE_APP_URL: https://dev.nextdrink.me
  JS_CODE_MAIL: test@mybetwer.com
  BUCKET_NAME: next-drink-content

build_env_variables:
  NODE_ENV: "production"
  PORT: 8080
  POSTGRES_HOST: $DBHOST
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "next-drink"
  POSTGRES_PASSWORD: $DBPASS
  POSTGRES_PORT: "5432"
  PRIVATE_KEY: $PRIVATE_KEY
  MAILGUN_API_KEY: $MAILGUN_API_KEY
  MAILGUN_API_DOMAIN: $MAILGUN_API_DOMAIN
  FE_APP_URL: https://dev.nextdrink.me
  JS_CODE_MAIL: test@mybetwer.com
  BUCKET_NAME: next-drink-content
